<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ClickMe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        button {
            padding: 18px 80px;
            font-size: 22px;
            background: #ffffff;
            color: #999999;
            border: 2px solid #cccccc;
            cursor: pointer;
            letter-spacing: 6px;
        }

        button:hover { color: #666666; border-color: #999999; }

        video {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <button onclick="go()">нажми</button>
    <video id="v" playsinline>
        <source src="scary.mp4" type="video/mp4">
    </video>

    <script>
        function go() {
            document.body.style.background = 'black';
            document.querySelector('button').style.display = 'none';
            var v = document.getElementById('v');
            v.style.display = 'block';
            v.muted = false;
            v.play();
        }
    </script>

</body>
</html>
